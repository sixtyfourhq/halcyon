name: Generate Halcyon ISOs

on:
  workflow_run:
    workflows: ["bluebuild"]
    types: [completed]
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch:

jobs:
  build-iso:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            image: ghcr.io/sixtyfourhq/halcyon:latest
            filename: halcyon.iso
          - variant: nvidia
            image: ghcr.io/sixtyfourhq/halcyon-nvidia:latest
            filename: halcyon-nvidia.iso

    permissions:
      contents: read
      packages: read

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          temp-reserve-mb: 256
          swap-size-mb: 0
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: Install BlueBuild CLI
        shell: bash
        run: |
          set -euo pipefail
          docker run --pull always --rm ghcr.io/blue-build/cli:latest-installer | sudo bash
          bluebuild --version

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate ISO
        shell: bash
        run: |
          set -euo pipefail
          sudo bluebuild generate-iso \
            --iso-name "${{ matrix.filename }}" \
            image "${{ matrix.image }}"

      - name: Configure MinIO Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MINIO_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.MINIO_SECRET_KEY }}
          aws-region: us-east-1

      - name: Upload to MinIO
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp "./${{ matrix.filename }}" "s3://${{ secrets.MINIO_BUCKET }}/isos/" \
            --endpoint-url "${{ secrets.MINIO_ENDPOINT }}"
