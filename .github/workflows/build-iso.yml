name: Generate Halcyon ISOs
on:
  workflow_run:
    workflows: ["bluebuild"]
    types:
      - completed
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch:

jobs:
  build-iso:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: "standard"
            image: "ghcr.io/sixtyfourhq/halcyon:latest"
            filename: "halcyon.iso"
          - variant: "nvidia"
            image: "ghcr.io/sixtyfourhq/halcyon-nvidia:latest"
            filename: "halcyon-nvidia.iso"

    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: Install BlueBuild CLI
        run: |
          curl -L https://raw.githubusercontent.com/blue-build/cli/main/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate ISO
        run: |
          # Use -E to pass the GITHUB_PATH updates into the sudo environment
          sudo -E $HOME/.local/bin/bluebuild generate-iso \
            --iso-name "${{ matrix.filename }}" \
            image ${{ matrix.image }}

      - name: Configure MinIO Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.MINIO_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.MINIO_SECRET_KEY }}
          aws-region: us-east-1

      - name: Upload to MinIO
        run: |
          aws s3 cp ./${{ matrix.filename }} s3://${{ secrets.MINIO_BUCKET }}/isos/ \
            --endpoint-url ${{ secrets.MINIO_ENDPOINT }}
