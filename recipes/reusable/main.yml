modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - bieszczaders/kernel-cachyos-addons
    remove:
      packages:
        - zram-generator-defaults
    install:
      skip-unavailable: true
      packages:
        - cachyos-settings
        - scx-scheds
        - scx-tools
        - scx-manager
  - type: dnf
    remove:
      packages:
        - plasma-discover

  - type: dnf
    install:
      packages:
        - ptyxis
  - from-file: reusable/common.yml
  - from-file: reusable/nix.yml
  - from-file: reusable/common-misc.yml
